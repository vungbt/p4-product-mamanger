name: Chromatic

# PR: publish Storybook only (no snapshot baseline)
# main: publish + accept new snapshots as baseline

on:
  pull_request:
    paths:
      - 'libs/ui/**'
      - '.github/workflows/chromatic.yml'
  push:
    branches:
      - main
    paths:
      - 'libs/ui/**'
      - '.github/workflows/chromatic.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --filter @p4/ui...

      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          workingDir: libs/ui
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}
          exitOnceUploaded: ${{ github.event_name == 'pull_request' }}

      - name: Comment Storybook preview on PR
        if: always() && github.event_name == 'pull_request' && steps.chromatic.outputs.storybookUrl
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = "<!-- chromatic-preview-comment -->";
            const storybookUrl = "${{ steps.chromatic.outputs.storybookUrl }}";
            const buildUrl = "${{ steps.chromatic.outputs.buildUrl }}";
            const changeCount = "${{ steps.chromatic.outputs.changeCount }}";
            const sha = context.sha.slice(0, 7);

            const lines = [MARKER, `📖 **Storybook Preview:** ${storybookUrl}`];
            if (buildUrl) {
              const changes = Number(changeCount) > 0 ? ` (${changeCount} visual changes)` : "";
              lines.push(`🔍 **Chromatic build:** ${buildUrl}${changes}`);
            }
            lines.push("", `<sub>Cập nhật cho commit ${sha}</sub>`);
            const body = lines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
