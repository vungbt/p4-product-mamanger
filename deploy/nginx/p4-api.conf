# Install after issuing the certificate with certbot webroot at /var/www/p4/acme.
server {
    listen 80;
    server_name p4-api.itclabs.site;

    location /.well-known/acme-challenge/ {
        root /var/www/p4/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name p4-api.itclabs.site;

    ssl_certificate /etc/letsencrypt/live/p4-api.itclabs.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p4-api.itclabs.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HTTP/2 multiplexes the many small module chunks; compress text assets (images/fonts are already compressed).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    location /design {
        alias /var/www/p4-design;
        index design-system.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }
}
