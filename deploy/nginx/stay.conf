# Stay — install after issuing certificates with the certbot webroot /var/www/stay/acme
# (scripts/deploy.stay.sh --setup does both). STAY_WEB_HOST / STAY_API_HOST are replaced by the
# deploy script.

server {
    listen 80;
    server_name STAY_WEB_HOST STAY_API_HOST;

    location /.well-known/acme-challenge/ {
        root /var/www/stay/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Web: static files + same-origin /api (Better Auth cookies stay on the web host).
server {
    listen 443 ssl;
    http2 on;
    server_name STAY_WEB_HOST;
    root /var/www/stay/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/STAY_WEB_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAY_WEB_HOST/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Server-Sent Events: no buffering, long reads.
    location ~ ^/api/(portal/)?notifications/stream$ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 12M;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# API host: health checks and the API reference.
server {
    listen 443 ssl;
    http2 on;
    server_name STAY_API_HOST;

    ssl_certificate /etc/letsencrypt/live/STAY_API_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAY_API_HOST/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 12M;
    }
}
