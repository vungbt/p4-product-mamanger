<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Stay</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16897d"/>
      <stop offset="1" stop-color="#0a5a53"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfeae2"/>
      <stop offset="1" stop-color="#f4fbfa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- swoosh -->
  <path d="M108 318 C 40 396, 200 456, 448 370 C 300 430, 104 424, 108 318 Z" fill="url(#swoosh)"/>
  <!-- chimney -->
  <rect x="334" y="100" width="40" height="104" rx="16" fill="#dcf2ee"/>
  <!-- roof -->
  <polyline points="104,248 256,112 408,248" fill="none" stroke="#f4fbfa" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- left wall -->
  <line x1="152" y1="240" x2="152" y2="362" stroke="#f4fbfa" stroke-width="32" stroke-linecap="round"/>
  <!-- window -->
  <g fill="#f7d999">
    <rect x="222" y="168" width="31" height="31" rx="7"/>
    <rect x="259" y="168" width="31" height="31" rx="7"/>
    <rect x="222" y="205" width="31" height="31" rx="7"/>
    <rect x="259" y="205" width="31" height="31" rx="7"/>
  </g>
  <!-- bed -->
  <g fill="none" stroke="#f4fbfa" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 292 V 360"/>
    <path d="M196 338 H 290 V 360"/>
  </g>
  <rect x="212" y="306" width="44" height="22" rx="11" fill="#f4fbfa"/>
  <!-- clipboard -->
  <g transform="rotate(8 352 326)">
    <rect x="302" y="262" width="104" height="132" rx="18" fill="#eef8f6"/>
    <rect x="330" y="248" width="48" height="26" rx="9" fill="#eef8f6" stroke="#0e6b62" stroke-width="7"/>
    <circle cx="354" cy="246" r="8" fill="#eef8f6" stroke="#0e6b62" stroke-width="6"/>
    <g fill="none" stroke="#0e6b62" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="320,312 331,323 348,304"/>
      <polyline points="320,348 331,359 348,340"/>
      <line x1="362" y1="314" x2="390" y2="314"/>
      <line x1="362" y1="350" x2="390" y2="350"/>
    </g>
  </g>
</svg>
