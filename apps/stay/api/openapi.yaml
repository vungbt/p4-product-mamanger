    post:
      tags:
        - portal
      operationId: post_api_portal_sessions
      summary: Vào cổng người thuê (4 số cuối SĐT)
      description: >-
        Công khai; giới hạn theo IP và theo token. So sánh 4 số cuối SĐT của chính người ở (constant-time). Link sai/thu
        hồi/hết hạn và sai số đều trả cùng 401 `portal_verification_failed`. Sai 5 lần liên tiếp → khoá link 15 phút
        (429 `portal_link_locked`, `Retry-After`, `extensions.retryAfterSeconds`). Thành công: đặt cookie HttpOnly
        `stay_portal_session` (SameSite=Lax, path `/api/portal`, Secure ở production, 90 ngày), chỉ lưu SHA-256 của giá
        trị cookie; ghi lần mở gần nhất.


        **Công khai.**
      security: []
      x-audit-action: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalSessionInput"
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PortalSessionResult"
                  message:
                    type: string
                required:
                  - data
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Link không đúng/đã thu hồi/hết hạn hoặc sai 4 số cuối (`portal_verification_failed`, không phân biệt).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          description: Quá số lần thử theo IP/token (`rate_limit_exceeded`) hoặc link đang bị khoá sau 5 lần sai
            (`portal_link_locked`, `extensions.retryAfterSeconds`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
        - portal
      operationId: delete_api_portal_sessions
      summary: Đăng xuất cổng người thuê
      description: >-
        Xoá phiên cổng của thiết bị này và xoá cookie. Không có phiên hợp lệ → 401 `portal_session_invalid`. Ghi qua
        cookie cần origin web được phép.


        **Yêu cầu phiên cổng người thuê** (cookie `stay_portal_session`).
      security:
        - portalSession: []
      x-audit-action: logout
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PortalSignOutResult"
                  message:
                    type: string
                required:
                  - data
        "401":
          description: "Không có phiên cổng hợp lệ (`portal_session_invalid`): hết hạn, link bị thu hồi, hợp đồng kết thúc quá 30
            ngày hoặc người ở đã rời."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
