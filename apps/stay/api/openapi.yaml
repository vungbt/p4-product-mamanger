components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Better Auth session token
    sessionCookie:
      type: apiKey
      in: cookie
      name: stay.session_token
    Auth_apiKeyCookie:
      type: apiKey
      in: cookie
      name: apiKeyCookie
      description: API Key authentication via cookie
    Auth_bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ; `extensions` map từng field với thông báo lỗi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Access token hoặc phiên không hợp lệ/đã hết hạn.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Không đủ quyền hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Không tìm thấy tài nguyên hoặc actor không được xem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Xung đột version, trạng thái, tồn kho, quota, quote hoặc idempotency.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Vượt giới hạn tần suất; làm theo header Retry-After.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        extensions:
          type: object
          additionalProperties: {}
      required:
        - message
    StayCapabilities:
      type: object
      properties:
        contractVersion:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/StayRule"
      required:
        - contractVersion
        - rules
    StayMe:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/StayUser"
      required:
        - user
    StayRule:
      type: object
      properties:
        action:
          anyOf:
            - type: string
              enum:
                - read
            - type: string
              enum:
                - create
            - type: string
              enum:
                - update
            - type: string
              enum:
                - delete
            - type: string
              enum:
                - manage
            - type: string
              enum:
                - issue
            - type: string
              enum:
                - void
            - type: string
              enum:
                - settle
            - type: string
              enum:
                - "*"
            - type: array
              items:
                type: string
                enum:
                  - "*"
                  - create
                  - delete
                  - issue
                  - manage
                  - read
                  - settle
                  - update
                  - void
        subject:
          anyOf:
            - type: string
              enum:
                - Building
            - type: string
              enum:
                - Room
            - type: string
              enum:
                - Tenant
            - type: string
              enum:
                - Contract
            - type: string
              enum:
                - Deposit
            - type: string
              enum:
                - MeterReading
            - type: string
              enum:
                - Invoice
            - type: string
              enum:
                - Payment
            - type: string
              enum:
                - Expense
            - type: string
              enum:
                - Maintenance
            - type: string
              enum:
                - Settings
            - type: string
              enum:
                - Report
            - type: string
              enum:
                - AuditLog
            - type: string
              enum:
                - Member
            - type: string
              enum:
                - all
            - type: array
              items:
                type: string
                enum:
                  - AuditLog
                  - Building
                  - Contract
                  - Deposit
                  - Expense
                  - Invoice
                  - Maintenance
                  - Member
                  - MeterReading
                  - Payment
                  - Report
                  - Room
                  - Settings
                  - Tenant
                  - all
        conditions:
          type: object
          additionalProperties: {}
        inverted:
          type: boolean
      required:
        - action
        - subject
    StayUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type:
            - string
            - "null"
        emailVerified:
          type: boolean
        role:
          type: string
          enum:
            - manager
            - owner
            - tenant
        buildingIds:
          type: array
          items:
            type: string
        contractIds:
          type: array
          items:
            type: string
      required:
        - id
        - email
        - displayName
        - avatarUrl
        - emailVerified
        - role
        - buildingIds
        - contractIds
    Auth_User:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
          default: false
          readOnly: true
        image:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        role:
          type: string
          default: tenant
          readOnly: true
        accountStatus:
          type: string
          default: active
          readOnly: true
      required:
        - id
        - name
        - email
        - emailVerified
        - createdAt
        - updatedAt
    Auth_Session:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgent:
          type: string
        userId:
          type: string
      required:
        - id
        - expiresAt
        - token
        - createdAt
        - updatedAt
        - userId
    Auth_Account:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        accountId:
          type: string
        providerId:
          type: string
        userId:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        idToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        scope:
          type: string
        password:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - accountId
        - providerId
        - userId
        - createdAt
        - updatedAt
    Auth_Verification:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        identifier:
          type: string
        value:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - identifier
        - value
        - expiresAt
        - createdAt
        - updatedAt
