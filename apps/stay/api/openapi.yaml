openapi: 3.1.0
info:
  title: Stay API
  version: 1.0.0
  description: |-
    API quản lý nhà trọ Stay.

    ## Xác thực
    Đăng nhập qua `POST /api/auth/sign-in/email` (Better Auth). Trình duyệt dùng cookie HttpOnly
    `stay.session_token`; client khác gửi `Authorization: Bearer <token>`. Không có đăng ký công khai:
    tài khoản do chủ trọ tạo. Quyền của người dùng hiện tại lấy từ `GET /api/me/capabilities` (rule CASL).

    ## Quy ước chung
    - Response thành công có dạng `{ data, message? }`, danh sách có thêm `meta` phân trang.
    - Tiền là số nguyên VND. Kỳ dạng `YYYY-MM`, ngày nghiệp vụ `YYYY-MM-DD` theo Asia/Ho_Chi_Minh.
    - `X-Request-Id` có trong mọi response, dùng khi báo lỗi.
    - Mọi dữ liệu nghiệp vụ gắn `buildingId`; quyền kiểm tra theo toà.
servers:
  - url: /
    description: Current API server
tags:
  - name: me
    description: Người dùng hiện tại và quyền CASL.
  - name: operations
    description: Kiểm tra trạng thái dịch vụ.
  - name: auth-native
    description: Better Auth native endpoints. Browser clients use @stay/sdk/auth and HttpOnly `stay.*` session cookies.
paths:
  /api/me:
    get:
      tags:
        - me
      operationId: get_api_me
      summary: Người dùng hiện tại
      description: |-
        Gồm vai trò và các toà được gán (người quản lý).

        **Yêu cầu đăng nhập.**
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: read
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StayMe"
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/me/capabilities:
    get:
      tags:
        - me
      operationId: get_api_me_capabilities
      summary: Quyền của người dùng hiện tại
      description: |-
        Rule CASL dùng với `stayAbilityKit` của `@stay/shared`; `contractVersion` đổi khi hợp đồng API thay đổi.

        **Yêu cầu đăng nhập.**
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: read
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StayCapabilities"
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /health/live:
    get:
      tags:
        - operations
      operationId: get_health_live
      summary: Liveness
      description: "**Công khai.**"
      security: []
      responses:
        "200":
          description: Service sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /health:
    get:
      tags:
        - operations
      operationId: get_health
      summary: Health check
      description: |-
        Kiểm tra kết nối database; trả 503 khi database không sẵn sàng.

        **Công khai.**
      security: []
      responses:
        "200":
          description: Service sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  database:
                    type: string
                    enum:
                      - up
                      - down
        "503":
          description: Database không sẵn sàng
  /api/auth/sign-in/social:
    post:
      tags:
        - auth-native
      description: Sign in with a social provider
      operationId: auth_post__sign_in_social
      security:
        - Auth_bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackURL:
                  type: string
                  description: Callback URL to redirect to after the user has signed in
                newUserCallbackURL:
                  type: string
                errorCallbackURL:
                  type: string
                  description: Callback URL to redirect to if an error happens
                provider:
                  anyOf:
                    - type: string
                      enum:
                        - apple
                        - atlassian
                        - cloudflare
                        - cognito
                        - discord
                        - facebook
                        - figma
                        - github
                        - microsoft
                        - google
                        - huggingface
                        - slack
                        - spotify
                        - twitch
                        - twitter
                        - dropbox
                        - kick
                        - linear
                        - linkedin
                        - gitlab
                        - tiktok
                        - reddit
                        - roblox
                        - salesforce
                        - vk
                        - zoom
                        - notion
                        - kakao
                        - naver
                        - line
                        - paybin
                        - paypal
                        - polar
                        - railway
                        - vercel
                        - wechat
                    - type: string
                disableRedirect:
                  type: boolean
                  description: Disable automatic redirection to the provider. Useful for handling the redirection yourself
                idToken:
                  type: object
                  properties:
                    token:
                      type: string
                      description: ID token from the provider
                    nonce:
                      type: string
                      description: Nonce used to generate the token
                    accessToken:
                      type: string
                      description: Access token from the provider
                    refreshToken:
                      type: string
                      description: Refresh token from the provider
                    expiresAt:
                      type: number
                      description: Expiry date of the token
                    user:
                      type: object
                      properties:
                        name:
                          type: object
                          properties:
                            firstName:
                              type: string
                            lastName:
                              type: string
                        email:
                          type: string
                      description: The user object from the provider. Only available for some providers like Apple.
                  required:
                    - token
                scopes:
                  type: array
                  items:
                    type: string
                  description: Array of scopes to request from the provider. This will override the default scopes passed.
                requestSignUp:
                  type: boolean
                  description: Explicitly request sign-up. Useful when disableImplicitSignUp is true for this provider
                loginHint:
                  type: string
                  description: The login hint to use for the authorization code request
                additionalParams:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                  description: Extra query parameters to append to the provider authorization URL (e.g. Cognito identity_provider, Google
                    hd).
                additionalData:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
              required:
                - provider
      responses:
        "200":
          description: Success - Returns session details (idToken branch) or an authorize URL (redirect branch)
          content:
            application/json:
              schema:
                type: object
                description: Returns session details when idToken is provided, or an authorize URL otherwise
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    $ref: "#/components/schemas/Auth_User"
                  url:
                    type: string
                  redirect:
                    type: boolean
                required:
                  - redirect
        "400":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
          description: Bad Request. Usually due to missing parameters, or invalid parameters.
        "401":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
          description: Unauthorized. Due to missing or invalid authentication.
        "403":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Forbidden. You do not have permission to access this resource or to perform this action.
        "404":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Not Found. The requested resource was not found.
        "429":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Too Many Requests. You have exceeded the rate limit. Try again later.
        "500":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Internal Server Error. This is a problem with the server that you cannot fix.
      x-audit-action: login
      summary: Sign in with a social provider
