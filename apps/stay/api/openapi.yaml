          in: query
          schema:
            type: string
            enum:
              - fullName
              - createdAt
            default: fullName
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: q
          in: query
          schema:
            type: string
            maxLength: 255
        - name: status
          in: query
          schema:
            type: string
            enum:
