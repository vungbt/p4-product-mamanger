components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Better Auth session token
    sessionCookie:
      type: apiKey
      in: cookie
      name: stay.session_token
    Auth_apiKeyCookie:
      type: apiKey
      in: cookie
      name: apiKeyCookie
      description: API Key authentication via cookie
    Auth_bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication
    portalSession:
      type: apiKey
      in: cookie
      name: stay_portal_session
      description: "Phiên cổng người thuê (ST-25) từ `POST /api/portal/sessions`: HttpOnly, SameSite=Lax, path `/api/portal`,
        90 ngày; production dùng tên `__Secure-stay_portal_session`. Không phải phiên Better Auth."
  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ; `extensions` map từng field với thông báo lỗi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Access token hoặc phiên không hợp lệ/đã hết hạn.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Không đủ quyền hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Không tìm thấy tài nguyên hoặc actor không được xem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Xung đột version, trạng thái, tồn kho, quota, quote hoặc idempotency.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Vượt giới hạn tần suất; làm theo header Retry-After.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    AddOccupantRequestPayload:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        fromDate:
          type: string
      required:
        - fullName
        - phone
        - fromDate
    AddVehicleRequestPayload:
      type: object
      properties:
        plate:
          type: string
        vehicleType:
          type: string
          enum:
            - bicycle
            - car
            - electric_bike
            - motorbike
            - other
        fromDate:
          type: string
      required:
        - plate
        - vehicleType
        - fromDate
    AnnouncementDeleteResult:
      type: object
      properties:
        id:
          type: string
        deleted:
          type: boolean
      required:
        - id
        - deleted
    AnnouncementInput:
      type: object
      properties:
        buildingId:
          type: string
        title:
          type: string
        body:
          type: string
        roomIds:
          type:
            - array
            - "null"
          items:
            type: string
        pinned:
          type: boolean
        expiresOn:
          type:
            - string
            - "null"
      required:
        - buildingId
        - title
        - body
    ApiError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        extensions:
          type: object
          additionalProperties: {}
      required:
        - message
    BillingDraftResult:
      type: object
      properties:
        created:
          type: number
        refreshed:
          type: number
        replayed:
          type: boolean
        buildingId:
          type: string
        period:
          type: string
        utilityPeriod:
          type: string
        issueDate:
          type: string
        dueDate:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BillingPreviewRow"
        eligibleCount:
          type: number
        excludedCount:
          type: number
        expectedTotal:
          type: number
      required:
        - created
        - refreshed
        - replayed
        - buildingId
        - period
        - utilityPeriod
        - issueDate
        - dueDate
        - rows
        - eligibleCount
        - excludedCount
        - expectedTotal
    BillingPreview:
      type: object
      properties:
        buildingId:
          type: string
        period:
          type: string
        utilityPeriod:
          type: string
        issueDate:
          type: string
        dueDate:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BillingPreviewRow"
        eligibleCount:
          type: number
        excludedCount:
          type: number
        expectedTotal:
          type: number
      required:
        - buildingId
        - period
        - utilityPeriod
        - issueDate
        - dueDate
        - rows
        - eligibleCount
        - excludedCount
        - expectedTotal
    BillingPreviewRow:
      type: object
      properties:
        contractId:
          type: string
        contractCode:
          type: string
        roomId:
          type: string
        roomCode:
          type: string
        eligible:
          type: boolean
        reason:
          type:
            - string
            - "null"
          enum:
            - already_issued
            - invalid_data
            - missing_meter
            - missing_reading
            - move_in_invoice
            - negative_consumption
            - no_occupancy
            - null
        reasonDetail:
          type:
            - object
            - "null"
          properties:
            kind:
              type: string
              enum:
                - electricity
                - water
            period:
              type: string
            message:
              type: string
        invoiceId:
          type:
            - string
            - "null"
        invoiceStatus:
          type:
            - string
            - "null"
          enum:
            - draft
            - issued
            - paid
            - partially_paid
            - void
            - null
        subtotal:
          type:
            - number
            - "null"
        total:
          type:
