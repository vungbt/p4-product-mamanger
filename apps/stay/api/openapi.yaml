openapi: 3.1.0
info:
  title: Stay API
  version: 1.0.0
  description: |-
    API quản lý nhà trọ Stay.

    ## Xác thực
    Đăng nhập qua `POST /api/auth/sign-in/email` (Better Auth). Trình duyệt dùng cookie HttpOnly
    `stay.session_token`; client khác gửi `Authorization: Bearer <token>`. Không có đăng ký công khai:
    tài khoản do chủ trọ tạo. Quyền của người dùng hiện tại lấy từ `GET /api/me/capabilities` (rule CASL).

    ## Quy ước chung
    - Response thành công có dạng `{ data, message? }`, danh sách có thêm `meta` phân trang.
    - Tiền là số nguyên VND. Kỳ dạng `YYYY-MM`, ngày nghiệp vụ `YYYY-MM-DD` theo Asia/Ho_Chi_Minh.
    - `X-Request-Id` có trong mọi response, dùng khi báo lỗi.
    - Mọi dữ liệu nghiệp vụ gắn `buildingId`; quyền kiểm tra theo toà.
servers:
  - url: /
    description: Current API server
tags:
  - name: announcements
    description: "Thông báo cho người thuê (O-32): cả toà hoặc một số phòng, ghim, ngày hết hạn hiển thị. Cổng người thuê
      chỉ hiện thông báo còn hạn của toà/phòng mình."
  - name: audit
    description: Lịch sử thay đổi đã ẩn dữ liệu nhạy cảm.
  - name: automation
    description: Tự động hoá theo toà, chỉ tạo bản nháp; nhắc qua email và thông báo. Nhắc chủ trọ trước ngày chốt số
      `readingReminderDaysBefore` ngày (0 = tắt) và vào ngày chốt số, chỉ khi còn phòng thiếu chỉ số. Nhắc người thuê
      trước hạn 1 ngày và sau hạn 3 ngày, hoặc vào ngày đầu tiên quá hạn khi toà có `graceDays` > 0.
  - name: buildings
    description: Toà nhà, kỳ thu và tài khoản nhận tiền theo toà, đơn giá ghi đè theo ngày.
  - name: contracts
    description: Hợp đồng thuê, kích hoạt (tạo hoá đơn nhận phòng nháp), huỷ bản nháp, xem trước tiền nhận phòng, báo trả
      phòng và thanh lý (ST-17).
  - name: deposits
    description: Sổ cọc bất biến; thu thêm, hoàn, mất cọc và cấn trừ thanh lý.
  - name: expenses
    description: Chi phí vận hành, danh mục chi phí và tổng theo kỳ. Ảnh hoá đơn lưu private.
  - name: invoices
    description: "Hoá đơn: xem trước và tạo bản nháp kỳ M (tiền phòng + dịch vụ M, điện nước M−1), phụ thu/giảm trừ, phát
      hành (cấp mã, khoá chỉ số), void. Mọi số tiền tính bằng `@stay/billing` tại server; dòng hoá đơn là snapshot."
  - name: me
    description: Người dùng hiện tại và quyền CASL.
  - name: members
    description: "Người quản lý theo toà: mời qua email, gán toà/nhóm quyền và khoá tài khoản; chỉ chủ trọ."
  - name: notifications
    description: Thông báo trong ứng dụng (nhân viên theo toà, người thuê theo hợp đồng), luồng SSE, email SMTP và thông báo
      trình duyệt (Web Push) gửi qua outbox sau commit; cài đặt kênh/nhóm sự kiện theo người.
  - name: operations
    description: Kiểm tra trạng thái dịch vụ.
  - name: overview
    description: "Tổng quan tháng: phải thu/đã thu/còn lại của kỳ, công nợ, phòng theo trạng thái, tỷ lệ lấp đầy, 6 kỳ gần
      nhất và việc cần làm. Tổng hợp ở server, chỉ đọc."
  - name: payments
    description: Thu tiền hoá đơn (một hoặc nhiều lần), sổ thu và huỷ bút toán thu. Thanh toán không sửa/xoá; `paidTotal` và
      trạng thái hoá đơn luôn tính lại từ tổng các khoản chưa huỷ trong cùng transaction.
  - name: portal
    description: "Cổng người thuê (ST-25): link riêng cho từng người ở (chủ trọ tạo/thu hồi) và các route `/api/portal/*`
      cho người thuê không cần tài khoản. Vào cổng bằng token của link + 4 số cuối SĐT → cookie phiên cổng HttpOnly
      `stay_portal_session` (production `__Secure-stay_portal_session`, path `/api/portal`, 90 ngày). Cookie phiên nhân
      viên (`stay.session_token`) không dùng được ở cổng và cookie cổng không dùng được ở route nhân viên. Mọi dữ liệu
      chỉ thuộc hợp đồng của link; người ở cùng chỉ hiện tên viết tắt."
  - name: readings
    description: Chốt chỉ số điện nước, lưu theo dòng và thay đồng hồ; tiêu thụ tính theo các đoạn đồng hồ.
  - name: receivables
    description: "Công nợ theo hợp đồng: hoá đơn đã phát hành chưa thu đủ, tổng còn lại, quá hạn theo `dueOn` và ngày hiện
      tại Asia/Ho_Chi_Minh (nhóm chưa tới hạn, 1–7, 8–30, > 30 ngày). Chỉ đọc."
  - name: reports
    description: Báo cáo tổng hợp SQL theo tháng, theo phòng, điện nước và xuất sổ Excel. Chỉ đọc, có phân quyền theo toà.
  - name: requests
    description: 'Hộp "Yêu cầu từ người thuê" (O-26, ST-25): báo hỏng, yêu cầu thay đổi hợp đồng và báo chuyển khoản từ cổng
      người thuê. Người thuê chỉ đề nghị; duyệt yêu cầu gọi đúng thao tác ST-12/ST-17 trong cùng transaction, xác nhận
      chuyển khoản tạo khoản thu ST-15. Audit chỉ ghi id và trạng thái.'
  - name: residents
    description: Tạm trú theo ngày, khai báo theo lần ở và xuất Excel có audit.
  - name: rooms
    description: Phòng theo toà, sơ đồ phòng, tạo nhanh nhiều phòng, đồng hồ điện/nước và bảo trì. Trạng thái phòng suy ra
      từ hợp đồng.
  - name: settings
    description: "Cấu hình hệ thống: kỳ thu mặc định và danh mục dịch vụ, đơn giá mặc định."
  - name: tenants
    description: "Hồ sơ người thuê, ảnh CCCD (private), xe và import từ CSV/XLSX. Dữ liệu cá nhân: chỉ chủ trọ và người quản
      lý toà của người thuê được xem; CCCD che giữa, không ghi rõ vào log/audit."
  - name: uploads
    description: "Tải ảnh private (CCCD): xin ticket → gửi file thẳng tới `uploadUrl` → `complete` → gắn `fileId`. Ảnh chỉ
      xem qua URL ký ngắn hạn."
  - name: auth-native
    description: Better Auth native endpoints. Browser clients use @stay/sdk/auth and HttpOnly `stay.*` session cookies.
paths:
  /api/public/invoices/{token}:
    get:
      tags:
        - invoices
      operationId: get_api_public_invoices_token
      summary: Hoá đơn công khai qua link chia sẻ
      description: >-
        Không cần đăng nhập, giới hạn 60 yêu cầu/phút mỗi IP. Token không tồn tại, hết hạn, đã thu hồi/làm mới, hoặc hoá
        đơn void → 404. Dữ liệu tối giản: toà (tên, địa chỉ), phòng, kỳ, loại, mã, trạng thái, ngày phát hành/hạn, các
        dòng (mô tả i18n, số tiền, chỉ số), tổng, đã thu, còn lại, tên người đại diện viết tắt, tài khoản nhận tiền và
        `vietQrPayload` (VietQR NAPAS cho số còn lại, nội dung theo mẫu hệ thống với mã hoá đơn; `null` khi đã thu đủ
        hoặc toà chưa có tài khoản). Không có SĐT, CCCD, ghi chú hay id nội bộ.


        **Công khai.**
      security: []
      x-audit-action: read
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PublicInvoice"
                  message:
                    type: string
                required:
                  - data
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/audit-logs:
    get:
      tags:
        - audit
      operationId: get_api_audit_logs
      summary: Lịch sử thay đổi
      description: |-
        Người quản lý chỉ xem các toà được gán. from/to gồm cả ngày kết thúc.

        **Quyền:** `read:AuditLog`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: read
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              - createdAt
              - action
              - resourceType
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: q
          in: query
          schema:
            type: string
            maxLength: 255
        - name: actorId
          in: query
          schema:
            type: string
        - name: buildingId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
            maxLength: 128
        - name: resourceType
          in: query
          schema:
            type: string
            maxLength: 80
        - name: resourceId
          in: query
          schema:
            type: string
            maxLength: 128
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StayAuditLog"
                  message:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - data
                  - meta
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/audit-logs/{id}:
    get:
      tags:
        - audit
      operationId: get_api_audit_logs_id
      summary: Chi tiết thay đổi
      description: |-
        Ngoài phạm vi trả 404; nội dung được redact khi đọc.

        **Quyền:** `read:AuditLog`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StayAuditLog"
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/buildings/{id}/automation:
    get:
      tags:
        - automation
      operationId: get_api_buildings_id_automation
      summary: Cấu hình tự động hoá
      description: |-
        Chỉ toà được phép đọc. Mặc định tắt các job và tắt toàn bộ nhắc người thuê.

        **Quyền:** `read:Building`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StayAutomationSettings"
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags:
        - automation
      operationId: put_api_buildings_id_automation
      summary: Lưu tự động hoá
      description: >-
        manage Building; gửi đủ năm cờ và version (`readingReminderBefore`, `readingReminderDaysBefore` 0–10 bỏ trống =
        tắt/1 ngày); stale version trả 409, có audit.


        **Quyền:** `manage:Building`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StayAutomationSettings"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StayAutomationSettings"
                  message:
                    type: string
                required:
                  - data
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/notifications:
    get:
      tags:
        - automation
      operationId: get_api_notifications
      summary: Thông báo nhân viên
      description: |-
        50 thông báo mới nhất trong các toà được phép đọc; unreadCount tính tất cả. Đã đọc riêng từng người.

        **Quyền:** `read:Building`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: read
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StayNotifications"
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/notifications/{id}/read:
    post:
      tags:
        - automation
      operationId: post_api_notifications_id_read
      summary: Đánh dấu đã đọc
      description: |-
        Idempotent, chỉ trong toà được phép đọc; có audit.

        **Quyền:** `read:Building`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                    required:
                      - id
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/notifications/stream:
    get:
      tags:
        - notifications
      operationId: get_api_notifications_stream
      summary: Luồng thông báo (SSE)
      description: >-
        Server-Sent Events của thông báo nhân viên mới trong các toà được phép đọc (đánh thức bằng Postgres NOTIFY sau
        commit). Client giữ polling `GET /api/notifications` làm dự phòng.


        **Quyền:** `read:Building`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: read
      responses:
        "200":
          description: "Luồng `text/event-stream`: `event: ready` khi mở, `event: notification` với `data` là
            `NotificationStreamEvent` (JSON), comment `: ping` mỗi 25 giây. Server đóng luồng sau 10 phút; EventSource
            tự kết nối lại."
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/me/notification-settings:
    get:
      tags:
        - notifications
      operationId: get_api_me_notification_settings
      summary: Cài đặt nhận thông báo
      description: >-
        Kênh email/trình duyệt và nhóm sự kiện bị tắt của người dùng hiện tại (mặc định bật hết), kèm `emailAvailable`,
        `pushPublicKey` (VAPID, null khi chưa cấu hình) và số thiết bị đã đăng ký.


        **Yêu cầu đăng nhập.**
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: read
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSettings"
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags:
        - notifications
      operationId: put_api_me_notification_settings
      summary: Lưu cài đặt nhận thông báo
      description: >-
        `{ email, push, mutedGroups }`. Thông báo trong ứng dụng luôn được ghi; cài đặt chỉ áp dụng cho email và thông
        báo trình duyệt. Có audit.


        **Yêu cầu đăng nhập.**
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSettings"
                  message:
                    type: string
                required:
                  - data
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/me/push-subscriptions:
    post:
      tags:
        - notifications
      operationId: post_api_me_push_subscriptions
      summary: Đăng ký thông báo trình duyệt
      description: >-
        `PushSubscription.toJSON()` của trình duyệt. Endpoint phải thuộc dịch vụ push của trình duyệt (HTTPS).
        Idempotent theo endpoint; cùng trình duyệt đăng nhập người khác thì chuyển sang người đó.


        **Yêu cầu đăng nhập.**
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PushSubscriptionResult"
                  message:
                    type: string
                required:
                  - data
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags:
        - notifications
      operationId: delete_api_me_push_subscriptions
      summary: Huỷ đăng ký thông báo trình duyệt
      description: |-
        `{ endpoint }`; chỉ xoá endpoint của chính người dùng. Không có thì không làm gì.

        **Yêu cầu đăng nhập.**
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: delete
