  /api/auth/sign-up/email:
    post:
      tags:
        - auth-native
      description: Sign up a user using email and password
      operationId: auth_post__sign_up_email
      security:
        - Auth_bearerAuth: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the user
                email:
                  type: string
                  description: The email of the user
                password:
                  type: string
                  description: The password of the user
                image:
                  type: string
                  description: The profile image URL of the user
                callbackURL:
                  type: string
                  description: The URL to use for email verification callback
                rememberMe:
                  type: boolean
                  description: If this is false, the session will not be remembered. Default is `true`.
              required:
                - name
                - email
                - password
      responses:
        "200":
          description: Successfully created user
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    nullable: true
                    description: Authentication token for the session
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The unique identifier of the user
                      email:
                        type: string
                        format: email
                        description: The email address of the user
                      name:
                        type: string
                        description: The name of the user
                      image:
                        type: string
                        format: uri
                        nullable: true
                        description: The profile image URL of the user
                      emailVerified:
                        type: boolean
                        description: Whether the email has been verified
                      createdAt:
                        type: string
                        format: date-time
                        description: When the user was created
                      updatedAt:
                        type: string
                        format: date-time
                        description: When the user was last updated
                    required:
                      - id
                      - email
                      - name
                      - emailVerified
                      - createdAt
                      - updatedAt
                required:
                  - user
        "400":
          content:
            application/json:
