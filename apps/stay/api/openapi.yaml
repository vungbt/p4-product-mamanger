            schema:
              type: object
              properties:
                buildingId:
                  type: string
                  format: uuid
                gender:
                  type:
                    - string
                    - "null"
                  enum:
                    - male
                    - female
                    - other
                    - null
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 120
                phone:
                  type: string
                  minLength: 10
                  maxLength: 20
                email:
                  type:
                    - string
                    - "null"
                  maxLength: 255
                idNumber:
                  type:
                    - string
                    - "null"
                  pattern: ^[0-9 .-]{12,20}$
                idIssuedAt:
                  type:
                    - string
                    - "null"
                  format: date
                birthDate:
                  type:
                    - string
                    - "null"
                  format: date
                hometown:
                  type:
                    - string
                    - "null"
                  maxLength: 255
                permanentAddress:
                  type:
                    - string
                    - "null"
                  maxLength: 255
                occupation:
                  type:
                    - string
                    - "null"
                  maxLength: 255
                note:
                  type:
                    - string
                    - "null"
                  maxLength: 2000
              required:
                - buildingId
                - fullName
                - phone
      responses:
        "201":
          description: Thành công
