        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                readingDay:
                  type: integer
                  minimum: 1
                  maximum: 31
                readingDayMonth:
                  type: string
                  enum:
