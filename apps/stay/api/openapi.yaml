    post:
      tags:
        - contracts
      operationId: post_api_contracts_id_settle
      summary: Thanh lý hợp đồng
      description: >-
        Chỉ chủ trọ (`settle:Contract`). Một transaction: khoá hợp đồng, phòng, hoá đơn; từ chối khi còn hoá đơn nháp
        (409 `contract_has_draft_invoices` kèm danh sách); tạo và phát hành hoá đơn `settlement` (khoá chỉ số đã dùng);
        cọc ghi thành thanh toán phương thức `deposit` trên đúng hoá đơn được trả (nợ cũ trước, rồi hoá đơn thanh lý)
        kèm bút toán cọc `applied`; phần còn lại hoàn bằng bút toán `refunded` (`refundMethod`, ngày hôm nay); cọc không
        đủ thì phần thiếu còn nợ trên hoá đơn; hợp đồng → ended (`movedOutAt`), người ở/xe/dịch vụ kết thúc từ ngày sau
        ngày trả phòng, phòng về trống. Số liệu trùng với bản xem trước. Gửi lại `version` đã đọc; dữ liệu đã bị người
        khác sửa thì trả 409 `version_conflict`.


        **Quyền:** `settle:Contract`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      x-audit-action: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: "Bắt buộc; mỗi lần xác nhận thanh lý dùng một key, bấm lại dùng lại key (trả kết quả cũ, `replayed: true`)."
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractSettleInput"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ContractSettlementResult"
                  message:
                    type: string
                required:
                  - data
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Hợp đồng không ở trạng thái active/ending (`contract_not_active`), còn hoá đơn nháp
            (`contract_has_draft_invoices`, `extensions.invoices`: `SettlementDraftInvoice[]`), đã có chỉ số sau ngày
            trả phòng (`reading_after_move_out`), đổi phòng sau ngày trả phòng (`contract_has_future_room_change`),
            `version_conflict` hoặc key đã dùng với nội dung khác (`idempotency_conflict`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Ngày trả phòng sau hôm nay hoặc trước ngày bắt đầu, thiếu/nhỏ hơn chỉ số trước (`finalElectric`,
            `finalWater`), phụ thu thiếu lý do, ảnh không hợp lệ; `invalid_settlement` khi dữ liệu tính tiền không hợp
