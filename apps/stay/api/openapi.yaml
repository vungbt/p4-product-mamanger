      tags:
        - tenants
      operationId: post_api_tenants
      summary: Tạo người thuê
      description: >-
        Gửi `buildingId` của toà. Chỉ bắt buộc `fullName` và `phone` (10 số, bắt đầu 0; nhận cả `+84`, khoảng trắng, dấu
        chấm và tự chuẩn hoá). CCCD 12 số, duy nhất toàn hệ thống: trùng → 400 với `extensions.idNumber` và
        `extensions.duplicateTenant` (`tenantId` chỉ có khi người dùng được xem hồ sơ đó). Ngày dạng `YYYY-MM-DD` (hoặc
        `dd/MM/yyyy`), không sau hôm nay. Không tự điền giá trị nào.


        **Quyền:** `create:Tenant`.
