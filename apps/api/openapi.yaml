openapi: 3.1.0
info:
  title: P4 Commerce API
  version: 1.0.0
  description: >-
    API cho shop quần áo: Admin và Storefront.


    ## Xác thực

    Gửi `Authorization: Bearer <token>` với `token` lấy từ response đăng nhập. Token hết hạn thì gọi `POST
    /api/auth/refresh`.

    Mỗi operation ghi rõ quyền cần có; danh sách quyền của user hiện tại lấy từ `GET /api/me/capabilities`.


    ## Quy ước chung

    - Response thành công có dạng `{ data, message? }`, danh sách có thêm `meta` phân trang.

    - Số tiền là số nguyên VND, không nhân/chia 100.

    - `X-Request-Id` có trong mọi response, dùng khi báo lỗi.

    - `expectedVersion` bảo vệ cập nhật đồng thời; sai version trả 409.

    - `Idempotency-Key` bắt buộc ở các giao dịch và job được ghi chú. Retry cùng payload dùng lại key cũ;
      cùng key khác payload trả 409.

    ## Import, export và upload nhiều file

    Các thao tác này trả 202 kèm process. Theo dõi trạng thái, version và tiến độ qua `GET /api/processes/{id}`

    hoặc Socket.IO. Import luôn kiểm tra trước, trả lỗi từng dòng, rồi chờ `POST /api/processes/{id}/confirm`

    mới ghi dữ liệu. Giới hạn: import 5.000 dòng, export 10.000 dòng; file hết hạn sau 24 giờ.


    ## Realtime

    Socket.IO cùng origin với API. Handshake gửi `auth: { token, offset }`. Server phát event tên `event` gồm

    `id`, `createdAt` và `payload` có `type` là `process.updated`, `notification.created` hoặc

    `notification.read`. Khi reconnect, gửi `offset` cuối để nhận lại event bị lỡ của chính user đó.

    FE gộp process theo `version` và notification theo `id`. Client dùng sẵn trong `@p4/realtime`, `@p4/processes`.


    ## Đổi hàng

    `settlementPolicy=refund_and_repurchase`: hoàn tiền đơn gốc và thanh toán đơn thay thế là hai giao dịch

    độc lập; `priceDifference` chỉ là chênh lệch ròng để hiển thị.


    ## Lưu ý vận hành

    API và worker phải dùng chung `PROCESS_STORAGE_DIR`. Stripe, Cloudinary và mail cần cấu hình provider;

    mock chỉ dùng ngoài production. Báo cáo ledger không tự suy diễn các bản ghi cũ thiếu bằng chứng thu/hoàn.
servers:
  - url: /
    description: Current API server
tags:
  - name: accounts
    description: Đăng ký, xác minh email, đặt lại mật khẩu, hồ sơ, tuỳ chọn và phiên đăng nhập.
  - name: addresses
    description: Sổ địa chỉ giao hàng của người dùng.
  - name: audit
    description: Nhật ký thao tác quản trị.
  - name: auth
    description: Đăng nhập, refresh token, đăng xuất và thông tin người dùng hiện tại.
  - name: cart
    description: Giỏ hàng lưu phía server theo từng SKU.
  - name: catalog
    description: Xuất bản sản phẩm, biến thể SKU và bảng size.
  - name: categories
    description: Danh mục sản phẩm.
  - name: checkout
    description: "Báo giá checkout: server tính giá, giảm giá và phí ship rồi lưu snapshot."
  - name: content
    description: Blog, trang CMS, chính sách, revision và lịch xuất bản.
  - name: coupons
    description: Mã giảm giá.
  - name: dashboard
    description: Số liệu tổng quan cho Admin.
  - name: discovery
    description: Tìm kiếm, gợi ý và bộ lọc sản phẩm.
  - name: exchanges
    description: Đổi hàng, gắn với yêu cầu trả hàng và đơn thay thế.
  - name: files
    description: Upload ticket theo owner/purpose, tải file và xoá file.
  - name: fulfillment
    description: Nhiều kiện hàng cho một đơn, trạng thái vận chuyển và tracking.
  - name: inventory
    description: "Tồn kho theo SKU qua ledger: nhập kho, điều chỉnh, đối soát."
  - name: jobs
    description: Theo dõi và chạy lại job nền.
  - name: merchandising
    description: Bộ sưu tập, banner, điều hướng và bố cục trang chủ.
  - name: notifications
    description: Hộp thư thông báo, tuỳ chọn nhận và mẫu thông báo.
  - name: operations
    description: Health check, metrics và đối soát vận hành.
  - name: orders
    description: Đặt đơn, vòng đời đơn hàng và yêu cầu huỷ.
  - name: payments
    description: Lần thanh toán, COD, thanh toán mock và webhook Stripe có chữ ký.
  - name: processes
    description: "Import/export và upload nhiều file bằng worker: preview, tiến độ, lỗi từng dòng, tải file riêng tư."
  - name: products
    description: Sản phẩm, ảnh và đánh giá theo sản phẩm.
  - name: promotions
    description: Khuyến mãi tự động và lịch sử dùng coupon.
  - name: refunds
    description: Hoàn tiền, retry, đối soát và xác nhận chuyển khoản thủ công.
  - name: reports
    description: Báo cáo doanh thu, đơn hàng, tồn kho, sản phẩm và file export.
  - name: returns
    description: "Trả hàng: duyệt, nhận hàng, kiểm tra và hoàn tất."
  - name: reviews
    description: Đánh giá đã mua, kiểm duyệt, phản hồi và báo cáo vi phạm.
  - name: settings
    description: Cấu hình shop, thương mại và phương thức vận chuyển.
  - name: staff
    description: Nhân viên, vai trò, lời mời và quản lý trạng thái khách hàng.
  - name: support
    description: Ticket hỗ trợ, tin nhắn và ghi chú nội bộ.
  - name: system
    description: Quyền của người dùng hiện tại và contract trạng thái.
  - name: wishlist
    description: Danh sách yêu thích và đăng ký báo còn hàng.
paths:
  /api/me/capabilities:
    get:
      tags:
        - system
      operationId: get_api_me_capabilities
      summary: Quyền của tôi
      description: "**Yêu cầu đăng nhập.**"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      contractVersion:
                        type: string
                      permissions:
                        type: array
                        items:
                          $ref: "#/components/schemas/Permission"
                    required:
                      - contractVersion
                      - permissions
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/admin/system/contracts:
    get:
      tags:
        - system
      operationId: get_api_admin_system_contracts
      summary: Contract trạng thái của hệ thống
      description: "**Quyền:** `system:read`."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      version:
                        type: string
                      policy:
                        type: object
                        properties:
                          currency:
                            type: string
                          moneyUnit:
                            type: string
                          timezone:
                            type: string
                          quoteTtlSeconds:
                            type: number
                          reservationTtlSeconds:
                            type: number
                          returnWindowDays:
                            type: number
                          idempotencyTtlHours:
                            type: number
                          maxPageSize:
                            type: number
                        required:
                          - currency
                          - moneyUnit
                          - timezone
                          - quoteTtlSeconds
                          - reservationTtlSeconds
                          - returnWindowDays
                          - idempotencyTtlHours
                          - maxPageSize
                      transitions:
                        type: object
                        description: "Theo từng loại: map từ trạng thái hiện tại sang các trạng thái được chuyển tới."
                        additionalProperties:
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: string
                    required:
                      - version
                      - policy
                      - transitions
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/admin/imports/{resource}:
    post:
      tags:
        - processes
      operationId: post_api_admin_imports_resource
      summary: Tải file import (CSV/XLSX)
      description: |-
        Worker kiểm tra file và trả preview; dữ liệu chỉ được ghi sau `confirm`.

        **Yêu cầu đăng nhập.** Bắt buộc header `Idempotency-Key`.
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: Dùng lại đúng key khi retry cùng payload; khác payload sẽ trả 409.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "202":
          description: Đã nhận; theo dõi qua process trả về.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      kind:
                        type: string
                        enum:
                          - data.export
                          - data.import
                          - media.batch
                      state:
                        type: string
                        enum:
                          - awaiting_confirmation
                          - cancelled
                          - completed
                          - completed_with_errors
                          - failed
                          - queued
                          - running
                      phase:
                        type: string
                        enum:
                          - apply
                          - generate
                          - validate
                          - verify
                      version:
                        type: number
                      progress:
                        type: number
                      processed:
                        type: number
                      total:
                        type: number
                      succeeded:
                        type: number
                      failed:
                        type: number
                      errorCode:
                        type:
                          - string
                          - "null"
                      result:
                        type:
                          - object
                          - "null"
                        properties:
                          resourceIds:
                            type: array
                            items:
                              type: string
                          downloadUrl:
                            type:
                              - string
                              - "null"
                          total:
                            type: number
                          succeeded:
                            type: number
                          failed:
                            type: number
                        required:
                          - resourceIds
                          - downloadUrl
                          - total
                          - succeeded
                          - failed
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      expiresAt:
                        type: string
                    required:
                      - id
                      - kind
                      - state
                      - phase
                      - version
                      - progress
                      - processed
                      - total
                      - succeeded
                      - failed
                      - errorCode
                      - result
                      - createdAt
                      - updatedAt
                      - expiresAt
                  message:
                    type: string
                required:
                  - data
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/admin/import-templates/{resource}:
    get:
      tags:
        - processes
      operationId: get_api_admin_import_templates_resource
      summary: Tải file mẫu import
      description: "**Yêu cầu đăng nhập.**"
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resource:
                        type: string
                        enum:
                          - categories
                          - inventory
                          - products
                          - variants
                      columns:
                        type: array
                        items:
                          type: string
                      format:
                        type: string
                      notes:
                        type: string
                    required:
                      - resource
                      - columns
                      - format
                      - notes
                  message:
                    type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/admin/exports:
    post:
      tags:
        - processes
      operationId: post_api_admin_exports
      summary: Tạo job export (CSV/XLSX)
      description: "**Yêu cầu đăng nhập.** Bắt buộc header `Idempotency-Key`."
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Dùng lại đúng key khi retry cùng payload; khác payload sẽ trả 409.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  description: Bộ lọc theo allowlist của từng resource; field lạ bị từ chối.
                  additionalProperties:
                    type:
                      - string
                      - number
                      - boolean
                      - "null"
                resource:
                  type: string
                  enum:
                    - categories
                    - inventory
                    - orders
                    - products
                    - sales-report
                    - variants
                format:
                  type: string
                  enum:
                    - csv
                    - xlsx
      responses:
        "202":
          description: Đã nhận; theo dõi qua process trả về.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      kind:
                        type: string
                        enum:
                          - data.export
                          - data.import
                          - media.batch
                      state:
                        type: string
                        enum:
                          - awaiting_confirmation
                          - cancelled
                          - completed
                          - completed_with_errors
                          - failed
                          - queued
                          - running
                      phase:
                        type: string
                        enum:
                          - apply
                          - generate
                          - validate
                          - verify
                      version:
                        type: number
                      progress:
                        type: number
                      processed:
                        type: number
                      total:
                        type: number
                      succeeded:
                        type: number
                      failed:
                        type: number
                      errorCode:
                        type:
                          - string
                          - "null"
                      result:
                        type:
                          - object
                          - "null"
                        properties:
                          resourceIds:
                            type: array
                            items:
                              type: string
                          downloadUrl:
                            type:
                              - string
                              - "null"
                          total:
                            type: number
                          succeeded:
                            type: number
                          failed:
                            type: number
                        required:
                          - resourceIds
                          - downloadUrl
                          - total
                          - succeeded
                          - failed
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      expiresAt:
                        type: string
                    required:
                      - id
                      - kind
                      - state
                      - phase
                      - version
                      - progress
                      - processed
                      - total
                      - succeeded
                      - failed
                      - errorCode
                      - result
                      - createdAt
                      - updatedAt
                      - expiresAt
                  message:
                    type: string
                required:
                  - data
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/files/uploads/batch:
    post:
      tags:
        - processes
      operationId: post_api_files_uploads_batch
      summary: Tạo upload ticket cho nhiều file
      description: "**Yêu cầu đăng nhập.**"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum:
                    - avatar
                    - blog
                    - product
                    - return
                    - review
                    - support
                names:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                resourceId:
                  type: string
                  maxLength: 128
              required:
                - purpose
                - names
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      batchId:
                        type: string
                      tickets:
                        type: array
                        items:
                          type: object
                          properties:
                            allowedMimeTypes:
                              type: array
                              items:
                                type: string
                            uploadUrl:
                              type: string
                            publicId:
                              type: string
                            id:
                              type: string
                            purpose:
                              type: string
                              enum:
                                - avatar
                                - blog
                                - product
                                - return
                                - review
                                - support
                            resourceId:
                              type:
                                - string
                                - "null"
                            status:
                              type: string
                              enum:
                                - completed
                                - pending
                                - rejected
                            private:
                              type: boolean
                            expiresAt:
                              type: string
                            fileId:
                              type:
                                - string
                                - "null"
                            maxBytes:
                              type: number
                            name:
                              type: string
                          required:
                            - allowedMimeTypes
                            - uploadUrl
                            - publicId
                            - id
                            - purpose
                            - resourceId
                            - status
                            - private
                            - expiresAt
                            - fileId
                            - maxBytes
                            - name
                    required:
                      - batchId
                      - tickets
                  message:
                    type: string
                required:
                  - data
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/files/uploads/batch/complete:
    post:
      tags:
        - processes
      operationId: post_api_files_uploads_batch_complete
      summary: Hoàn tất upload nhiều file
      description: |-
        Worker kiểm tra từng file; file lỗi không ảnh hưởng các file còn lại.

        **Yêu cầu đăng nhập.** Bắt buộc header `Idempotency-Key`.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Dùng lại đúng key khi retry cùng payload; khác payload sẽ trả 409.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 36
              required:
                - ticketIds
      responses:
        "202":
          description: Đã nhận; theo dõi qua process trả về.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      kind:
                        type: string
                        enum:
                          - data.export
                          - data.import
                          - media.batch
                      state:
                        type: string
                        enum:
                          - awaiting_confirmation
                          - cancelled
                          - completed
                          - completed_with_errors
                          - failed
                          - queued
                          - running
                      phase:
                        type: string
                        enum:
                          - apply
                          - generate
                          - validate
                          - verify
                      version:
                        type: number
                      progress:
                        type: number
                      processed:
                        type: number
                      total:
                        type: number
                      succeeded:
                        type: number
                      failed:
                        type: number
                      errorCode:
                        type:
                          - string
                          - "null"
                      result:
                        type:
                          - object
                          - "null"
                        properties:
                          resourceIds:
                            type: array
                            items:
                              type: string
                          downloadUrl:
                            type:
                              - string
                              - "null"
                          total:
                            type: number
                          succeeded:
                            type: number
                          failed:
                            type: number
                        required:
                          - resourceIds
                          - downloadUrl
                          - total
                          - succeeded
                          - failed
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      expiresAt:
                        type: string
                    required:
                      - id
                      - kind
                      - state
                      - phase
                      - version
                      - progress
                      - processed
                      - total
                      - succeeded
                      - failed
                      - errorCode
                      - result
                      - createdAt
                      - updatedAt
                      - expiresAt
                  message:
                    type: string
                required:
                  - data
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/processes:
    get:
      tags:
        - processes
      operationId: get_api_processes
      summary: Danh sách process của tôi
      description: "**Yêu cầu đăng nhập.**"
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: sortBy
          in: query
          schema:
            type: string
