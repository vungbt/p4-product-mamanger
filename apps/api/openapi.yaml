                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders/{id}/refunds:
    post:
      tags: [Orders]
      summary: Create refund for order (admin)
      operationId: createOrderRefund
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundCreateInput'
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Refund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/{id}/mock-pay:
    get:
      tags: [Payments]
      summary: Simulate mock payment via redirect (GET)
      operationId: mockPayGet
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/PaymentSecret'
      responses:
        '200':
          description: Payment confirmed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Payments]
      summary: Simulate mock payment (POST)
      operationId: mockPayPost
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/PaymentSecret'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPayBody'
      responses:
        '200':
          description: Payment confirmed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/webhook/mock:
    post:
      tags: [Payments]
      summary: Simulate payment provider webhook
      operationId: mockPaymentWebhook
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockWebhookRequest'
      responses:
        '200':
          description: Payment confirmed via webhook
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'

  /api/payments/webhook/stripe:
    post:
      tags: [Payments]
      summary: Stripe webhook (raw body + Stripe-Signature)
      description: |
        Handles `checkout.session.completed` (confirm paid) and `checkout.session.expired` (mark failed).
        Requires `STRIPE_WEBHOOK_SECRET`. Do not send JSON from Scalar — use Stripe CLI.
      operationId: stripePaymentWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe Event payload
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/refunds:
    get:
      tags: [Refunds]
      summary: List refunds (admin)
      operationId: listRefunds
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: orderId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by order ID
      responses:
        '200':
          description: Refund list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Refund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/addresses:
    get:
      tags: [Addresses]
      summary: List current user's addresses
      operationId: listAddresses
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Addresses]
      summary: Create address
      operationId: createAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/addresses/{id}:
    put:
      tags: [Addresses]
      summary: Update address
      operationId: updateAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInputPartial'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Addresses]
      summary: Delete address
      operationId: deleteAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: Address deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics (admin)
      operationId: getDashboardStats
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Dashboard stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/files/sign-upload-url:
    get:
      tags: [Files]
      summary: Get signed Cloudinary upload URL (admin)
      operationId: getSignUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: name
          in: query
          schema:
            type: string
          description: Original file name used to derive the public ID slug
      responses:
        '200':
          description: Signed upload URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SignedUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/files/sign-upload-urls:
    get:
      tags: [Files]
      summary: Get multiple signed upload URLs (admin)
      operationId: getSignUploadUrls
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: names
          in: query
          required: true
          description: Comma-separated file names or repeated query values
          schema:
            oneOf:
              - type: string
                example: photo-a.jpg,photo-b.jpg
              - type: array
                items:
                  type: string
      responses:
        '200':
          description: Signed upload URLs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SignedUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from login or refresh

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: vi
      description: Optional locale for translated messages
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
        default: ''
      description: Search keyword
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Product ID (string slug)
    ProductImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CouponId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Payment ID (same as order payment record)
    PaymentSecret:
      name: secret
      in: query
      schema:
        type: string
      description: Mock payment secret (also accepted in POST body)
    AddressId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: '@p4/api'

    SuccessEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        message:
          type: string

    PaginatedEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        message:
          type: string

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    ApiError:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        extensions:
          type: object
          additionalProperties: true

    Role:
      type: string
      enum: [admin, user]

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        avatarId:
          type: string
          format: uuid
          nullable: true
        avatarUrl:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@demo.com
        password:
          type: string
          format: password
          example: admin123

    LoginResponse:
      type: object
      required: [token, refreshToken, user]
      properties:
        token:
          type: string
          description: JWT access token
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UpdateProfileInput:
      type: object
      properties:
        imageStorageId:
          type: string
          description: Cloudinary public ID after client upload

    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string

    LogoutResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    Category:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    CategoryInputPartial:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    ProductImage:
      type: object
      required: [id, fileId, url, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        sortOrder:
          type: integer
          minimum: 0

    Product:
      type: object
      required: [id, name, price, description, imageUrl, stock]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: integer
          minimum: 0
          description: Price in smallest currency unit
        description:
          type: string
        imageUrl:
          type: string
        imageId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        category:
          allOf:
            - $ref: '#/components/schemas/Category'
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        stock:
          type: integer
          minimum: 0

    ProductInput:
      type: object
      required: [name, price, stock]
      properties:
        name:
          type: string
        price:
          type: integer
          minimum: 0
        description:
          type: string
        stock:
          type: integer
          minimum: 0
        imageStorageId:
          type: string
        categoryId:
          type: string
          format: uuid
          nullable: true
        imageStorageIds:
          type: array
          items:
            type: string

    ProductInputPartial:
      type: object
      properties:
        name:
          type: string
        price:
          type: integer
          minimum: 0
        description:
          type: string
        stock:
          type: integer
          minimum: 0
        imageStorageId:
          type: string
        categoryId:
          type: string
          format: uuid
          nullable: true

    AddProductImageInput:
      type: object
      required: [imageStorageId]
      properties:
        imageStorageId:
          type: string
        sortOrder:
          type: integer
          minimum: 0

    Review:
      type: object
      required: [id, productId, userId, rating, comment, createdAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
          format: email
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    CouponType:
      type: string
      enum: [percent, fixed]

    Coupon:
      type: object
      required: [id, code, type, value, minOrderAmount, usedCount, isActive]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        type:
          $ref: '#/components/schemas/CouponType'
        value:
          type: integer
          minimum: 1
        minOrderAmount:
          type: integer
          minimum: 0
        maxDiscount:
          type: integer
          minimum: 0
          nullable: true
        usageLimit:
          type: integer
          minimum: 1
          nullable: true
        usedCount:
          type: integer
          minimum: 0
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean

    CouponInput:
      type: object
      required: [code, type, value]
      properties:
        code:
          type: string
        type:
          $ref: '#/components/schemas/CouponType'
        value:
          type: integer
          minimum: 1
        minOrderAmount:
          type: integer
          minimum: 0
        maxDiscount:
          type: integer
          minimum: 0
          nullable: true
        usageLimit:
          type: integer
          minimum: 1
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean

    CouponInputPartial:
      type: object
      properties:
        code:
          type: string
        type:
          $ref: '#/components/schemas/CouponType'
        value:
          type: integer
          minimum: 1
        minOrderAmount:
          type: integer
          minimum: 0
        maxDiscount:
          type: integer
          minimum: 0
          nullable: true
        usageLimit:
          type: integer
          minimum: 1
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean

    CouponPreviewRequest:
      type: object
      required: [code, subtotal]
      properties:
        code:
          type: string
        subtotal:
          type: integer
          minimum: 0

    CouponPreviewResponse:
      type: object
      required: [coupon, discountAmount]
      properties:
        coupon:
          $ref: '#/components/schemas/Coupon'
        discountAmount:
          type: integer
          minimum: 0

    OrderStatus:
      type: string
      enum: [pending, paid, shipping, completed, cancelled]

    PaymentStatus:
      type: string
      enum: [pending, paid, failed]

    ShipmentStatus:
      type: string
      enum: [pending, shipped, delivered, cancelled]

    RefundStatus:
      type: string
      enum: [pending, completed, failed]

    OrderItem:
      type: object
      required: [productId, productName, quantity, unitPrice]
      properties:
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: integer
          minimum: 0

    ShippingAddressInput:
      type: object
      required: [fullName, phone, line1, city]
      properties:
        fullName:
          type: string
        phone:
          type: string
        line1:
          type: string
        city:
          type: string

    Payment:
      type: object
      required: [id, orderId, provider, amount, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        provider:
          type: string
          enum: [mock, stripe]
        amount:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/PaymentStatus'
        externalId:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        checkoutUrl:
          type: string
          description: Stripe hosted URL or relative mock-pay path when pending

    Shipment:
      type: object
      required: [id, orderId, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        carrier:
          type: string
          nullable: true
        trackingCode:
          type: string
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true

    OrderCouponInfo:
      type: object
      required: [code, discountAmount, couponId]
      properties:
        code:
          type: string
        discountAmount:
          type: integer
          minimum: 0
        couponId:
          type: string
          format: uuid

    Order:
      type: object
      required:
        - id
        - userId
        - userEmail
        - status
        - items
        - subtotal
        - discountAmount
        - shippingFee
        - total
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          type: integer
          minimum: 0
        discountAmount:
          type: integer
          minimum: 0
        shippingFee:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        shippingAddress:
          allOf:
            - $ref: '#/components/schemas/ShippingAddressInput'
          nullable: true
        payment:
          allOf:
            - $ref: '#/components/schemas/Payment'
          nullable: true
        shipment:
          allOf:
            - $ref: '#/components/schemas/Shipment'
          nullable: true
        coupon:
          allOf:
            - $ref: '#/components/schemas/OrderCouponInfo'
          nullable: true
        createdAt:
          type: string
          format: date-time

    CheckoutRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
