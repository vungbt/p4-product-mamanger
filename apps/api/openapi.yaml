        "201":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      replayed:
                        type: boolean
                      id:
                        type: string
                      orderId:
                        type: string
                      provider:
                        $ref: "#/components/schemas/PaymentProvider"
                      status:
                        $ref: "#/components/schemas/PaymentAttemptStatus"
                      amount:
                        type: number
                      currency:
                        type: string
                      checkoutUrl:
                        type:
                          - string
                          - "null"
                      reconciliation:
                        type: string
                        enum:
                          - duplicate_charge
                          - late_paid
                          - matched
                          - mismatch
                          - unreconciled
                      expiresAt:
                        type: string
                      paidAt:
                        type:
                          - string
                          - "null"
                      version:
                        type: number
                    required:
                      - replayed
                      - id
                      - orderId
                      - provider
                      - status
                      - amount
                      - currency
                      - checkoutUrl
                      - reconciliation
                      - expiresAt
                      - paidAt
                      - version
