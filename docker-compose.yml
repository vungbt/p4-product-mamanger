services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      # Host 5433 — tránh conflict với coupon-linkh (5432) trên cùng VPS
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-p4_product_manager}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    image: p4-api:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment: &api-environment
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-p4_product_manager}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      JWT_SECRET: ${JWT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-p4-product-manager}
      CLOUDINARY_DOMAIN: ${CLOUDINARY_DOMAIN:-https://api.cloudinary.com/v1_1}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_MOCK_SECRET: ${PAYMENT_MOCK_SECRET:-p4-mock-pay-secret}
      DEFAULT_SHIPPING_FEE: ${DEFAULT_SHIPPING_FEE:-30000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-vnd}
      CHECKOUT_SUCCESS_URL: ${CHECKOUT_SUCCESS_URL:-}
      CHECKOUT_CANCEL_URL: ${CHECKOUT_CANCEL_URL:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?MAIL_ENCRYPTION_KEY is required}
      MAIL_API_URL: ${MAIL_API_URL:-}
      MAIL_API_TOKEN: ${MAIL_API_TOKEN:-}
      PROCESS_STORAGE_DIR: /app/process-storage
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - process-storage:/app/process-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  worker:
    image: p4-api:latest
    pull_policy: never
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-environment
      RUN_SEED: "false"
    volumes:
      - process-storage:/app/process-storage
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  process-storage:
  pgdata:
