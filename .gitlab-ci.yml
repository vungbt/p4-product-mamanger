stages:
  - check

web:
  stage: check
  image: node:22-alpine
  before_script:
    - corepack enable
    - pnpm install --no-frozen-lockfile
  script:
    - pnpm lint
    - pnpm --filter @p4/blocks typecheck
    - pnpm --filter @p4/web build
    - pnpm build:storybook
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
